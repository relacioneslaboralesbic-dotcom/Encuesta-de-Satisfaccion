<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualización de Datos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 800px;
      width: 100%;
    }
    
    .top-logo {
      max-width: 180px;
      display: block;
      margin: 0 auto 20px auto;
    }
    .section-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .inline-icon {
      height: 1.2em;
      width: auto;
      vertical-align: text-bottom;
      margin-right: 6px;
    }
    .bottom-bar {
      width: 100%;
      height: auto;
      margin-top: 40px;
      border-radius: 4px;
      display: block;
    }

    h2 { color: #333; margin-top: 0; text-align: center; }
    h3 {
      color: #333;
      font-size: 1.1rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-top: 25px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-anon {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: block;
      width: fit-content;
      margin: 0 auto 20px auto;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; font-size: 0.9rem; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
    .hidden { display: none; }
    #cp-status { font-size: 0.8rem; margin-top: 5px; font-weight: normal; }
  </style>
</head>
<body>

<div class="card">
  <img src="Logo.png" alt="Logo" class="top-logo">
  
  <h2>Actualización de Datos</h2>
  <div class="badge-anon">🔒 Formulario Seguro sin Inicio de Sesión Requerido</div>

  <form id="datosForm">
    
    <h3><img src="Datos.png" class="section-icon" alt="Datos"> Datos Personales</h3>
    <div class="grid">
      <div class="form-group">
        <label>Número de Empleado *</label>
        <input type="text" id="numeroEmpleado" required>
      </div>
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="form-group">
        <label>Segundo Nombre</label>
        <input type="text" id="segundoNombre">
      </div>
      <div class="form-group">
        <label>Apellido Paterno *</label>
        <input type="text" id="apellidoPaterno" required>
      </div>
      <div class="form-group">
        <label>Apellido Materno</label>
        <input type="text" id="apellidoMaterno">
      </div>
      <div class="form-group">
        <label>Estado Civil</label>
        <select id="estadoCivil">
          <option value="">Seleccione...</option>
          <option value="Soltero(a)">Soltero(a)</option>
          <option value="Casado(a)">Casado(a)</option>
          <option value="Unión Libre">Unión Libre</option>
          <option value="Divorciado(a)">Divorciado(a)</option>
          <option value="Viudo(a)">Viudo(a)</option>
        </select>
      </div>
    </div>

    <h3><img src="Domicilio.png" class="section-icon" alt="Domicilio"> Domicilio y Contacto</h3>
    <div class="grid">
      <div class="form-group">
        <label>Código Postal *</label>
        <input type="text" id="codigoPostal" maxlength="5" required>
        <div id="cp-status"></div>
      </div>
      <div class="form-group">
        <label>Ciudad</label>
        <input type="text" id="ciudad" readonly style="background-color: #f9f9f9;">
      </div>
      
      <div class="form-group" id="container-colonia-select">
        <label>Colonia o Fraccionamiento *</label>
        <select id="colonia-select">
          <option value="">Primero ingresa un C.P.</option>
        </select>
      </div>
      <div class="form-group hidden" id="container-colonia-input">
        <label>Colonia o Fraccionamiento *</label>
        <input type="text" id="colonia-input">
      </div>

      <div class="form-group">
        <label>Calle</label>
        <input type="text" id="calle">
      </div>
      <div class="form-group">
        <label>Número</label>
        <input type="text" id="numeroDomicilio">
      </div>
      <div class="form-group">
        <label><img src="whatsapp.png" class="inline-icon" alt="WhatsApp"> Teléfono (WhatsApp) *</label>
        <input type="tel" id="telefonoWhatsapp" required>
      </div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="correo">
      </div>
    </div>

    <h3><img src="Emergencia.png" class="section-icon" alt="Emergencia"> Contactos de Emergencia y Tallas</h3>
    
    <!-- Contacto 1 agrupado en su propia fila -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label>Contacto de Emergencia 1 *</label>
        <input type="text" id="nombreContactoEmergencia" required>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label><img src="whatsapp.png" class="inline-icon" alt="WhatsApp"> Tel. Emergencia 1 (WhatsApp) *</label>
        <input type="tel" id="telefonoContactoEmergencia" required>
      </div>
    </div>

    <!-- Contacto 2 agrupado en su propia fila -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label>Contacto de Emergencia 2</label>
        <input type="text" id="nombreContactoEmergencia2">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label><img src="whatsapp.png" class="inline-icon" alt="WhatsApp"> Tel. Emergencia 2 (WhatsApp)</label>
        <input type="tel" id="telefonoContactoEmergencia2">
      </div>
    </div>

    <!-- Tallas agrupadas en su propia fila -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label>Talla de Playera</label>
        <select id="tallaPlayera">
          <option value="">Seleccione...</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="2XL">2XL</option>
          <option value="3XL">3XL</option>
          <option value="4XL">4XL</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label>Talla de Calzado (Mexicana 21 a 30)</label>
        <input type="number" step="0.5" min="21" max="30" id="tallaCalzado" placeholder="Ej. 26.5">
      </div>
    </div>

    <h3><img src="Family.png" class="section-icon" alt="Familia"> Información Familiar</h3>
    
    <!-- Contenedor de Pareja (Se oculta/muestra por JS) -->
    <div id="seccionPareja" class="grid hidden">
      <div class="form-group">
        <label>Nombre de Pareja</label>
        <input type="text" id="pareja">
      </div>
      <div class="form-group">
        <label>Fecha Nacimiento Pareja</label>
        <input type="date" id="fechaNacPareja">
      </div>
    </div>

    <div class="grid" style="margin-top: 15px;">
      <div class="form-group">
        <label>¿Tiene hijos?</label>
        <select id="tieneHijos">
          <option value="No">No</option>
          <option value="Si">Sí</option>
        </select>
      </div>
      <div class="form-group hidden" id="seccionCantidadHijos">
        <label>¿Cuántos hijos tiene?</label>
        <select id="cantidadHijos">
          <option value="0">Seleccione...</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option>
        </select>
      </div>
    </div>
    
    <!-- Contenedor para mostrar hijos en filas exactas -->
    <div id="contenedorHijos" style="margin-top: 10px;"></div>

    <button type="submit" id="btnEnviar">Guardar Registro</button>
  </form>

  <div id="status"></div>
  
  <img src="barra.jpg" alt="Barra Decorativa" class="bottom-bar">
</div>

<script>
  // URL DE GOOGLE APPS SCRIPT
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwY98H0V5z8dwo3m9sjxaeTXkG9aGWMtSKvEY_xwH7twITEzDXBISv-dD2dXXcXEPSa/exec';

  // Lógica de Autoformato a Mayúsculas/Minúsculas en nombres
  document.addEventListener('input', function(e) {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
      const excludedIds = ['codigoPostal', 'numeroDomicilio', 'correo', 'numeroEmpleado'];
      if (excludedIds.includes(e.target.id)) return;
      
      const el = e.target;
      const start = el.selectionStart;
      const end = el.selectionEnd;
      const val = el.value;

      const newVal = val.toLowerCase().replace(/(?:^|[\s\-\'\´\`])\S/g, function(match) {
        return match.toUpperCase();
      });

      if (val !== newVal) {
        el.value = newVal;
        el.setSelectionRange(start, end);
      }
    }
  });

  const estadoCivil = document.getElementById('estadoCivil');
  const seccionPareja = document.getElementById('seccionPareja');
  
  estadoCivil.addEventListener('change', function() {
    if (this.value === 'Casado(a)' || this.value === 'Unión Libre') {
      seccionPareja.classList.remove('hidden');
    } else {
      seccionPareja.classList.add('hidden');
      document.getElementById('pareja').value = '';
      document.getElementById('fechaNacPareja').value = '';
    }
  });

  const cpInput = document.getElementById('codigoPostal');
  const cpStatus = document.getElementById('cp-status');
  const ciudadInput = document.getElementById('ciudad');
  const coloniaSelect = document.getElementById('colonia-select');
  const coloniaInput = document.getElementById('colonia-input');
  const containerSelect = document.getElementById('container-colonia-select');
  const containerInput = document.getElementById('container-colonia-input');
  
  let abortController = null;

  cpInput.addEventListener('input', function() {
    let cpValue = this.value.trim();
    if (cpValue.length === 5) {
      buscarCP(cpValue);
    } else {
      resetCPFields();
    }
  });

  function resetCPFields() {
    ciudadInput.value = '';
    coloniaSelect.innerHTML = '<option value="">Primero ingresa un C.P.</option>';
    cpStatus.innerText = '';
    containerSelect.classList.remove('hidden');
    containerInput.classList.add('hidden');
    coloniaInput.value = '';
  }

  function buscarCP(cp) {
    cpStatus.style.color = '#0369a1';
    cpStatus.innerText = 'Buscando...';
    ciudadInput.value = 'Buscando...';
    
    if (abortController) abortController.abort();
    abortController = new AbortController();

    fetch(SCRIPT_URL + '?cp=' + cp, { signal: abortController.signal })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          ciudadInput.value = data.ciudad || 'No encontrada';
          
          if (data.colonias && data.colonias.length > 0) {
            coloniaSelect.innerHTML = '<option value="">Selecciona tu colonia</option>';
            data.colonias.forEach(c => {
              let opt = document.createElement('option');
              opt.value = c;
              opt.innerText = c;
              coloniaSelect.appendChild(opt);
            });
            containerSelect.classList.remove('hidden');
            containerInput.classList.add('hidden');
            cpStatus.style.color = 'green';
            cpStatus.innerText = 'Encontrado';
          } else {
            cpStatus.style.color = '#d97706';
            cpStatus.innerText = 'C.P. sin colonias. Escríbela:';
            ciudadInput.value = '';
            containerSelect.classList.add('hidden');
            containerInput.classList.remove('hidden');
          }
        } else {
          cpStatus.style.color = 'red';
          cpStatus.innerText = 'No encontrado. Ingresa manualmente.';
          ciudadInput.value = '';
          containerSelect.classList.add('hidden');
          containerInput.classList.remove('hidden');
        }
      })
      .catch(err => {
        if (err.name !== 'AbortError') {
          cpStatus.style.color = 'red';
          cpStatus.innerText = 'Error de conexión.';
          ciudadInput.value = '';
          containerSelect.classList.add('hidden');
          containerInput.classList.remove('hidden');
        }
      });
  }

  const tieneHijos = document.getElementById('tieneHijos');
  const seccionCantidad = document.getElementById('seccionCantidadHijos');
  const cantidadHijos = document.getElementById('cantidadHijos');
  const contenedorHijos = document.getElementById('contenedorHijos');

  tieneHijos.addEventListener('change', function() {
    if (this.value === 'Si') {
      seccionCantidad.classList.remove('hidden');
    } else {
      seccionCantidad.classList.add('hidden');
      cantidadHijos.value = "0";
      contenedorHijos.innerHTML = '';
    }
  });

  cantidadHijos.addEventListener('change', function() {
    let cantidad = parseInt(this.value);
    contenedorHijos.innerHTML = ''; 
    
    for(let i = 1; i <= cantidad; i++) {
      contenedorHijos.innerHTML += `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc;">
          <div class="form-group" style="margin-bottom: 0;">
            <label style="color:#0369a1;">Nombre Hijo ${i}</label>
            <input type="text" id="hijo${i}" required>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label style="color:#0369a1;">Fecha Nac. Hijo ${i}</label>
            <input type="date" id="fechaNacHijo${i}" required>
          </div>
        </div>
      `;
    }
  });

  document.getElementById('datosForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('status');
    
    btn.disabled = true;
    status.style.color = '#555';
    status.innerText = 'Guardando información...';

    // Determinar qué colonia enviar
    let coloniaFinal = "";
    if (containerInput.classList.contains('hidden')) {
      coloniaFinal = coloniaSelect.value;
    } else {
      coloniaFinal = coloniaInput.value;
    }

    const payload = {
      numeroEmpleado: document.getElementById('numeroEmpleado').value,
      nombre: document.getElementById('nombre').value,
      segundoNombre: document.getElementById('segundoNombre').value,
      apellidoPaterno: document.getElementById('apellidoPaterno').value,
      apellidoMaterno: document.getElementById('apellidoMaterno').value,
      estadoCivil: document.getElementById('estadoCivil').value,
      codigoPostal: document.getElementById('codigoPostal').value,
      ciudad: document.getElementById('ciudad').value,
      colonia: coloniaFinal,
      calle: document.getElementById('calle').value,
      numeroDomicilio: document.getElementById('numeroDomicilio').value,
      telefonoWhatsapp: document.getElementById('telefonoWhatsapp').value,
      correo: document.getElementById('correo').value,
      nombreContactoEmergencia: document.getElementById('nombreContactoEmergencia').value,
      telefonoContactoEmergencia: document.getElementById('telefonoContactoEmergencia').value,
      nombreContactoEmergencia2: document.getElementById('nombreContactoEmergencia2').value,
      telefonoContactoEmergencia2: document.getElementById('telefonoContactoEmergencia2').value,
      tallaPlayera: document.getElementById('tallaPlayera').value,
      tallaCalzado: document.getElementById('tallaCalzado').value,
      pareja: document.getElementById('pareja').value,
      fechaNacPareja: document.getElementById('fechaNacPareja').value
    };

    // Recolectar datos de los hijos
    for(let i = 1; i <= 10; i++) {
      let campoHijo = document.getElementById(`hijo${i}`);
      let campoFecha = document.getElementById(`fechaNacHijo${i}`);
      payload[`hijo${i}`] = campoHijo ? campoHijo.value : "";
      payload[`fechaNacHijo${i}`] = campoFecha ? campoFecha.value : "";
    }

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      status.style.color = 'green';
      status.innerText = '¡Registro guardado correctamente!';
      document.getElementById('datosForm').reset();
      resetCPFields();
      seccionPareja.classList.add('hidden');
      seccionCantidad.classList.add('hidden');
      contenedorHijos.innerHTML = '';
      btn.disabled = false;
      setTimeout(() => { status.innerText = ''; }, 5000);
    })
    .catch(error => {
      status.style.color = 'red';
      status.innerText = 'Ocurrió un error al intentar enviar el registro.';
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
